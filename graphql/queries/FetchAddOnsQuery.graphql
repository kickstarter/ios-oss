query FetchAddOns($projectSlug: String!, $shippingEnabled: Boolean!, $locationId: ID) {
  project(slug: $projectSlug) {
    ...ProjectFragment
    addOns {
      nodes {
        ...RewardFragment
        ...RewardImageFragment
        ...RewardItemsFragment
        shippingRulesExpanded(forLocation: $locationId) @include(if: $shippingEnabled) {
          nodes {
            ...ShippingRuleFragment
          }
        }
      }
    }
  }
}
