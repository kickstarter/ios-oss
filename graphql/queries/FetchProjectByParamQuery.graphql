# The full Project fetch, used by the Project page.
query FetchProjectByParam($projectId: Int, $slug: String) {
  project(pid: $projectId, slug: $slug) {
    ...ProjectFragment
    ...ExtendedProjectPropertiesFragment
    video {
      ...ProjectVideoFragment
    }
    backing {
      id
    }
    flagging {
      id
      kind
    }
  }
}
