query FetchProjectRewardsById($projectId: Int!, $includeShippingRules: Boolean!, $includePledgeOverTime: Boolean!) {
  project(pid: $projectId) {
    rewards {
      nodes {
        ...RewardFragment
        ...RewardImageFragment
        ...RewardItemsFragment
        ...RewardSimpleShippingRulesExpandedFragment @include(if: $includeShippingRules)
      }
    }
    ...PledgeOverTimeFragment @include(if: $includePledgeOverTime)
  }
}
