# An optimized Project fetch.
# Retrieves all the data needed for the checkout flow,
# in one query, with minimal extra data.
query FastFetchProjectForCheckoutQuery($projectId: Int, $slug: String) {
  project(pid: $projectId, slug: $slug) {
    ...ProjectFragment
    backing {
      ...BackingFragment
    }
    rewards {
      nodes {
        ...RewardFragment
      }
    }
  }
}
