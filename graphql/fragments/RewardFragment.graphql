fragment RewardFragment on Reward {
  amount {
    ...MoneyFragment
  }
  backersCount
  convertedAmount {
    ...MoneyFragment
  }
  allowedAddons {
    pageInfo {
      startCursor
    }
  }
  description
  displayName
  endsAt
  estimatedDeliveryOn
  id
  isMaxPledge
  available
  featured
  limit
  limitPerBacker
  localReceiptLocation {
    ...LocationFragment
  }
  name
  pledgeAmount {
    ...MoneyFragment
  }
  latePledgeAmount {
    ...MoneyFragment
  }
  postCampaignPledgingEnabled
  project {
    id
  }
  remainingQuantity
  shippingPreference
  shippingSummary
  startsAt
  audienceData {
    secret
  }
}
